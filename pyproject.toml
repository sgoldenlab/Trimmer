[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trimmer"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "asynccpu>=1.3.0",
    "ffmpeg-python>=0.2.0",
    "freesimplegui>=5.2.0.post1",
    "imutils>=0.5.4",
    "loguru>=0.7.0",
    "numpy>=2.0.2",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.2",
    "pyyaml>=6.0.2",
]

[tool.setuptools]
packages = ["trimmer"]

[project.scripts]
trimmer = "trimmer.basic_trimmer_class:main"
